name = "bridge-wallet"
compatibility_date = "2026-11-05"
pages_build_output_dir = "out"

[[r2_buckets]]
binding = "PACKAGE_IMAGES"
bucket_name = "bridge-wallet-package-images"

[[d1_databases]]
binding = "DB"
database_name = "bridge-wallet-db"
database_id = "876fdde8-1857-477a-94d0-218f9fb1862e"

[vars]
# Add RESEND_API_KEY in Cloudflare Pages dashboard
# Pages > bridge-wallet > Settings > Environment Variables > Production
# Variable name: RESEND_API_KEY
# Value: re_xxxxxxxxxxxxx (get from https://resend.com)
